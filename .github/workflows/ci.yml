name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  serial:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        toolchain:
          - name: Linux GCC
            platform: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: Linux Clang
            platform: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: Windows MSVC
            platform: windows-2022
            cc: cl.exe
            cxx: cl.exe
        include:
          - config: Debug
            toolchain:
              name: Optional Linux MPI smoke
              platform: ubuntu-24.04
              cc: gcc-13
              cxx: g++-13
              mpi: true
    runs-on: ${{ matrix.toolchain.platform }}
    env:
      NEXORA_CC: ${{ matrix.toolchain.cc }}
      NEXORA_CXX: ${{ matrix.toolchain.cxx }}
      NEXORA_CONFIG: ${{ matrix.config }}
      NEXORA_DOCS_CI: ${{ matrix.toolchain.name == 'Linux GCC' && matrix.config == 'Release' }}
    steps:
      - name: Set the runner validation path
        shell: bash
        run: |
          deps="$RUNNER_TEMP/nexora"
          run="$deps"
          if [[ "$NEXORA_DOCS_CI" == true ]]; then
            run=$(mktemp -d "$RUNNER_TEMP/nexora-docs.XXXXXXXX")
          fi
          printf 'NEXORA_DEPS=%s\nNEXORA_RUN=%s\n' "$deps" "$run" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Set up MSVC x64 for Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ tools were not found' }
          $previousPath = $env:Path -split ';'
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (!(Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC x64 environment was not initialized' }
          $addedPaths = @($env:Path -split ';' | Where-Object { $_ -and $_ -notin $previousPath })
          [array]::Reverse($addedPaths)
          $addedPaths | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          foreach ($name in @('INCLUDE', 'LIB', 'LIBPATH', 'VCToolsVersion', 'WindowsSDKVersion')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Install optional MPI C API inputs
        if: matrix.toolchain.mpi
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Identify the locked test dependencies
        id: dependencies
        shell: bash
        run: |
          key=$(python tools/validate_serial.py --cc "$NEXORA_CC" --cxx "$NEXORA_CXX" --config "$NEXORA_CONFIG" cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler-matched dependency installs
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NEXORA_DEPS }}/kokkos
            ${{ env.NEXORA_DEPS }}/gtest
          key: ${{ steps.dependencies.outputs.key }}-${{ hashFiles('tools/validate_serial.py') }}
      - name: Acquire and provision the locked Kokkos Serial and GoogleTest dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python tools/validate_serial.py --cc "$NEXORA_CC" --cxx "$NEXORA_CXX" --config "$NEXORA_CONFIG" provision \
            --archive "$NEXORA_RUN/kokkos-5.2.2.tar.gz" --gtest-archive "$NEXORA_RUN/googletest-1.17.0.tar.gz" --download \
            --prefix "$NEXORA_DEPS/kokkos" --gtest-prefix "$NEXORA_DEPS/gtest" --logs "$NEXORA_RUN/logs"
      - name: Prepare signed Ubuntu Doxygen and Graphviz packages
        if: env.NEXORA_DOCS_CI == 'true'
        run: bash tools/ci_doxygen.sh prepare
      - name: Verify GCC Release Serial and optional documentation without network access
        if: env.NEXORA_DOCS_CI == 'true'
        run: |
          sudo --non-interactive /usr/bin/unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            /usr/bin/env "PATH=$PATH" "ImageOS=${ImageOS:-}" "ImageVersion=${ImageVersion:-}" \
            "NEXORA_RUN=$NEXORA_RUN" "NEXORA_DEPS=$NEXORA_DEPS" "NEXORA_CC=$NEXORA_CC" \
            "NEXORA_CXX=$NEXORA_CXX" bash tools/ci_doxygen.sh verify
      - name: Verify Serial without network access
        if: runner.os == 'Linux' && !matrix.toolchain.mpi && env.NEXORA_DOCS_CI != 'true'
        shell: bash
        run: |
          sudo --non-interactive /usr/bin/unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            /usr/bin/env "PATH=$PATH" "ImageVersion=${ImageVersion:-}" "$(command -v python)" tools/validate_serial.py \
            --cc "$NEXORA_CC" --cxx "$NEXORA_CXX" --config "$NEXORA_CONFIG" verify \
            --prefix "$NEXORA_DEPS/kokkos" --gtest-prefix "$NEXORA_DEPS/gtest" --work-dir "$NEXORA_RUN/build" --logs "$NEXORA_RUN/logs" \
            --precisions float double --require-network-blocked
      - name: Verify Windows Serial
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python tools/validate_serial.py --cc "$NEXORA_CC" --cxx "$NEXORA_CXX" --config "$NEXORA_CONFIG" verify \
            --prefix "$NEXORA_DEPS/kokkos" --gtest-prefix "$NEXORA_DEPS/gtest" --work-dir "$NEXORA_RUN/build" --logs "$NEXORA_RUN/logs" --precisions float double
      - name: Verify the optional two-rank MPI smoke
        if: matrix.toolchain.mpi
        shell: bash
        run: |
          python tools/validate_serial.py --cc "$NEXORA_CC" --cxx "$NEXORA_CXX" --config "$NEXORA_CONFIG" verify \
            --prefix "$NEXORA_DEPS/kokkos" --gtest-prefix "$NEXORA_DEPS/gtest" --work-dir "$NEXORA_RUN/build" --logs "$NEXORA_RUN/logs" \
            --precisions float --mpi
      - name: Retain the offline public and internal HTML manuals
        if: env.NEXORA_DOCS_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-API-manuals
          if-no-files-found: error
          path: |
            ${{ env.NEXORA_RUN }}/docs/docs-float/docs/html
            ${{ env.NEXORA_RUN }}/docs/docs-double/docs/html
            ${{ env.NEXORA_RUN }}/docs/docs-float/docs-internal/html
      - name: Retain runner logs and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.toolchain.name }}-${{ matrix.config }}-validation
          path: ${{ env.NEXORA_RUN }}/logs
